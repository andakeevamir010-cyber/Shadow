<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;margin:0;padding:0;">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="description" content="Minecraft 1.8 WASM-GC" />
	<title>Minecraft 1.8</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body, html { width: 100%; height: 100%; overflow: hidden; background-color: black; }
		#game_frame { width: 100%; height: 100%; display: block; }
		#status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-family: monospace; text-align: center; z-index: 10000; background: rgba(0,0,0,0.9); padding: 20px; border: 2px solid #0f0; max-width: 90%; }
		#status h1 { font-size: 18px; margin-bottom: 10px; }
		#status p { font-size: 12px; margin: 5px 0; }
		#status .error { color: #f00; }
		#status .success { color: #0f0; }
		#status .info { color: #0ff; }
		#loading-bar { width: 200px; height: 20px; border: 2px solid #0f0; margin: 10px auto; }
		#loading-progress { height: 100%; background: #0f0; width: 0%; transition: width 0.2s; }
	</style>
</head>
<body id="game_frame">
	<div id="status">
		<h1>Minecraft 1.8 WASM-GC</h1>
		<p id="status-text" class="info">Initializing...</p>
		<div id="loading-bar"><div id="loading-progress"></div></div>
		<p id="status-error" class="error" style="display:none;"></p>
	</div>

	<script>
		'use strict';

		const STATUS = {
			text: (msg) => { document.getElementById('status-text').textContent = msg; document.getElementById('status-text').className = 'info'; },
			error: (msg) => { console.error(msg); document.getElementById('status-text').textContent = 'ERROR'; document.getElementById('status-text').className = 'error'; document.getElementById('status-error').textContent = msg; document.getElementById('status-error').style.display = 'block'; },
			success: (msg) => { console.log(msg); document.getElementById('status-text').textContent = msg; document.getElementById('status-text').className = 'success'; },
			progress: (pct) => { document.getElementById('loading-progress').style.width = Math.min(100, pct) + '%'; }
		};

		async function start() {
			try {
				STATUS.text('Checking HTTP mode...');
				if (window.location.href.indexOf('file:') === 0) {
					throw new Error('HTTP protocol required. Cannot run from file:// URL.');
				}
				STATUS.progress(5);

				STATUS.text('Loading bootstrap.js...');
				const bootstrapCode = await loadScript('https://raw.githubusercontent.com/yummyfiles/Minecraft-Launcher/main/mc/1.8.8-wasm/bootstrap.js');
				STATUS.progress(30);

				STATUS.text('Setting up game options...');
				const relayId = Math.floor(Math.random() * 3);
				window.eaglercraftXOpts = {
					demoMode: false,
					container: 'game_frame',
					assetsURI: 'https://raw.githubusercontent.com/yummyfiles/Minecraft-Launcher/main/mc/1.8.8-wasm/assets.epw',
					worldsDB: 'worlds',
					servers: [],
					relays: [
						{ addr: 'wss://relay.deev.is/', comment: 'lax1dude relay #1', primary: relayId === 0 },
						{ addr: 'wss://relay.lax1dude.net/', comment: 'lax1dude relay #2', primary: relayId === 1 },
						{ addr: 'wss://relay.shhnowisnottheti.me/', comment: 'ayunami relay #1', primary: relayId === 2 }
					]
				};

				// Check URL for server parameter
				const urlParams = new URLSearchParams(window.location.search);
				const serverParam = urlParams.get('server');
				if (serverParam) {
					STATUS.text('Server param found: ' + serverParam);
					window.eaglercraftXOpts.joinServer = serverParam;
				}

				STATUS.progress(40);
				STATUS.text('Executing bootstrap...');

				// Execute bootstrap code
				(function() { eval(bootstrapCode); }).call(window);
				STATUS.progress(50);

				if (typeof window.main !== 'function') {
					throw new Error('window.main() not found after bootstrap load');
				}

				STATUS.text('Starting Minecraft 1.8...');
				STATUS.progress(60);

				// Try to apply skin from launcher
				try {
					const rawSkin = localStorage.getItem('launcher.customSkin');
					if (rawSkin) {
						const skin = JSON.parse(rawSkin);
						if (skin && skin.data) {
							const model = skin.model === 'slim' ? 'slim' : 'default';
							const namespaces = ['_eaglercraft_1.12', '_eaglercraftX', '_eaglercraft_1.8'];
							for (let ns of namespaces) {
								try {
									let profile = JSON.parse(localStorage.getItem(ns + '.profile') || '{}');
									if (typeof profile !== 'object') profile = {};
									profile.customSkin = { data: skin.data || skin.raw, model: model };
									profile.customSkinModel = model;
									profile.presetSkin = 'CUSTOM';
									localStorage.setItem(ns + '.profile', JSON.stringify(profile));
								} catch (e) {}
							}
						}
					}
				} catch (e) {}

				// Call main
				window.main();
				STATUS.progress(80);

				// Monitor canvas
				monitorCanvasAndRemoveStatus();

			} catch (err) {
				STATUS.error('INIT FAILED: ' + err.message + '\n\nStack: ' + (err.stack || 'N/A'));
				console.error(err);
			}
		}

		async function loadScript(url) {
			const response = await fetch(url);
			if (!response.ok) {
				throw new Error(`HTTP ${response.status} loading ${url}`);
			}
			const text = await response.text();
			if (!text || text.length < 100) {
				throw new Error(`bootstrap.js content too short (${text.length} bytes) - likely 404 or empty`);
			}
			return text;
		}

		function monitorCanvasAndRemoveStatus() {
			let attempts = 0;
			const startTime = Date.now();

			function check() {
				const canvas = document.querySelector('canvas');
				if (canvas) {
					STATUS.success('Game loaded!');
					setTimeout(() => {
						const statusDiv = document.getElementById('status');
						if (statusDiv) statusDiv.remove();
					}, 1000);
					return;
				}

				if (attempts > 1800 || (Date.now() - startTime) > 30000) {
					STATUS.error('TIMEOUT: Canvas did not appear after 30 seconds. Game may have crashed.');
					return;
				}

				attempts++;
				STATUS.progress(80 + (attempts / 1800) * 20);
				requestAnimationFrame(check);
			}

			check();
		}

		// Prevent scroll
		window.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
		window.addEventListener('scroll', () => window.scrollTo(0, 0));

		// Start when DOM ready
		if (document.readyState === 'loading') {
			document.addEventListener('DOMContentLoaded', start);
		} else {
			start();
		}
	</script>
</body>
</html>
