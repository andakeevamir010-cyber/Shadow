<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;margin:0;padding:0;">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="description" content="Minecraft 1.8 WASM-GC" />
	<meta name="keywords" content="minecraft, 1.8, wasm" />
	<title>Minecraft 1.8</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body, html {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: black;
		}
		#game_frame {
			width: 100%;
			height: 100%;
			display: block;
		}
		#startup-screen {
			position: fixed;
			inset: 0;
			background: #000;
			z-index: 2147483647;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			color: #fff;
			font-family: monospace;
			image-rendering: pixelated;
		}
		#startup-screen p {
			margin: 10px;
			font-size: 14px;
			text-align: center;
		}
		#loading-bar-container {
			margin-top: 20px;
			width: 200px;
			height: 20px;
			border: 2px solid #888;
		}
		#loading-bar {
			height: 100%;
			background: #0f0;
			width: 0%;
			transition: width 0.3s;
		}
	</style>
</head>
<body id="game_frame">
	<div id="startup-screen">
		<p>Minecraft 1.8 WASM-GC</p>
		<p id="loading-text">Loading...</p>
		<div id="loading-bar-container">
			<div id="loading-bar"></div>
		</div>
	</div>

	<script>
		'use strict';

		// CDN URLs for game files (from yummyfiles/Minecraft-Launcher)
		const BOOTSTRAP_URL = 'https://raw.githubusercontent.com/yummyfiles/Minecraft-Launcher/main/mc/1.8.8-wasm/bootstrap.js';
		const ASSETS_URL = 'https://raw.githubusercontent.com/yummyfiles/Minecraft-Launcher/main/mc/1.8.8-wasm/assets.epw';

		function log(msg) {
			console.log('[MC] ' + msg);
		}

		function error(msg) {
			console.error('[MC] ' + msg);
		}

		function setLoadingText(text) {
			const el = document.getElementById('loading-text');
			if (el) el.textContent = text;
		}

		function setLoadingProgress(percent) {
			const bar = document.getElementById('loading-bar');
			if (bar) bar.style.width = Math.min(100, percent) + '%';
		}

		function removeStartupScreen() {
			const screen = document.getElementById('startup-screen');
			if (screen && screen.parentNode) {
				screen.parentNode.removeChild(screen);
			}
		}

		// Initialize game
		async function init() {
			try {
				// Check HTTP
				if (window.location.href.indexOf('file:') === 0) {
					throw new Error('HTTP required. Do not open locally.');
				}

				log('Initializing Minecraft 1.8 WASM-GC...');
				setLoadingText('Loading client...');
				setLoadingProgress(10);

				// Load skin from launcher if available
				try {
					const rawSkin = localStorage.getItem('launcher.customSkin');
					if (rawSkin) {
						const skin = JSON.parse(rawSkin);
						if (skin && skin.data) {
							log('Applying custom skin');
							const namespaces = ['_eaglercraft_1.12', '_eaglercraftX', '_eaglercraft_1.8'];
							const model = (skin.model === 'slim') ? 'slim' : 'default';
							for (let i = 0; i < namespaces.length; i++) {
								const ns = namespaces[i];
								try {
									const existing = localStorage.getItem(ns + '.profile');
									let profile = existing ? JSON.parse(existing) : {};
									if (typeof profile !== 'object' || profile === null) profile = {};
									profile.customSkin = { data: skin.data || skin.raw, model: model };
									profile.customSkinModel = model;
									profile.presetSkin = 'CUSTOM';
									localStorage.setItem(ns + '.profile', JSON.stringify(profile));
								} catch (e) {}
							}
						}
					}
				} catch (e) {}

				// Configure game
				log('Setting up game options');
				setLoadingProgress(15);
				
				const relayId = Math.floor(Math.random() * 3);
				window.eaglercraftXOpts = {
					demoMode: false,
					container: 'game_frame',
					assetsURI: ASSETS_URL,
					worldsDB: 'worlds',
					servers: [],
					relays: [
						{ addr: 'wss://relay.deev.is/', comment: 'lax1dude relay #1', primary: relayId == 0 },
						{ addr: 'wss://relay.lax1dude.net/', comment: 'lax1dude relay #2', primary: relayId == 1 },
						{ addr: 'wss://relay.shhnowisnottheti.me/', comment: 'ayunami relay #1', primary: relayId == 2 }
					]
				};

				// Check for server param
				const urlParams = new URLSearchParams(window.location.search);
				const serverParam = urlParams.get('server');
				if (serverParam) {
					log('Joining server: ' + serverParam);
					window.eaglercraftXOpts.joinServer = serverParam;
				}

				// Load bootstrap
				log('Loading bootstrap from: ' + BOOTSTRAP_URL);
				setLoadingProgress(25);
				
				const bootstrapScript = document.createElement('script');
				bootstrapScript.type = 'text/javascript';
				bootstrapScript.src = BOOTSTRAP_URL;
				
				bootstrapScript.onload = function() {
					log('Bootstrap loaded');
					setLoadingProgress(50);
					
					if (typeof window.main === 'function') {
						log('Starting client...');
						window.main();
					} else {
						throw new Error('window.main not available after bootstrap load');
					}
				};
				
				bootstrapScript.onerror = function() {
					throw new Error('Failed to load bootstrap from ' + BOOTSTRAP_URL);
				};
				
				document.head.appendChild(bootstrapScript);

			} catch (err) {
				error('Init failed: ' + err.message);
				setLoadingText('ERROR: ' + err.message);
				console.error(err);
			}
		}

		// Monitor for canvas and remove startup screen
		function monitorCanvas() {
			let attempts = 0;
			const maxAttempts = 1800;
			const startTime = Date.now();

			function check() {
				const canvas = document.querySelector('canvas');
				if (canvas) {
					log('Canvas detected, removing startup screen');
					removeStartupScreen();
					return;
				}

				if (attempts >= maxAttempts || (Date.now() - startTime) > 30000) {
					log('Timeout, removing startup screen');
					removeStartupScreen();
					return;
				}

				attempts++;
				requestAnimationFrame(check);
			}

			check();
		}

		// Start when ready
		if (document.readyState === 'loading') {
			document.addEventListener('DOMContentLoaded', function() {
				monitorCanvas();
				init();
			});
		} else {
			monitorCanvas();
			init();
		}

		// Prevent scrolling
		window.addEventListener('touchmove', function(e) {
			e.preventDefault();
		}, { passive: false });

		window.addEventListener('scroll', function() {
			window.scrollTo(0, 0);
		});
	</script>
</body>
</html>
