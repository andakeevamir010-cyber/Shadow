<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;margin:0;padding:0;">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="description" content="Minecraft 1.8 WASM-GC Standalone Client" />
	<meta name="keywords" content="minecraft, 1.8, wasm, eaglercraft" />
	<title>Minecraft 1.8 WASM-GC</title>
	<meta property="og:title" content="Minecraft 1.8 WASM-GC" />
	<meta property="og:description" content="Play Minecraft 1.8 in your browser" />
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		
		body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: black;
			font-family: Arial, sans-serif;
		}
		
		#game_frame {
			width: 100%;
			height: 100%;
			display: block;
		}
		
		#startup-screen {
			position: fixed;
			inset: 0;
			background: #000;
			image-rendering: pixelated;
			z-index: 2147483647;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			color: #fff;
			font-family: monospace;
		}
		
		#startup-screen p {
			margin: 10px;
			font-size: 14px;
			text-align: center;
		}
		
		#error-message {
			position: fixed;
			bottom: 20px;
			left: 20px;
			background: rgba(255, 0, 0, 0.8);
			color: white;
			padding: 15px;
			border-radius: 5px;
			font-family: monospace;
			font-size: 12px;
			max-width: 300px;
			z-index: 2147483648;
			display: none;
		}
		
		#loading-progress {
			margin-top: 20px;
			width: 200px;
			height: 20px;
			border: 2px solid #888;
			position: relative;
		}
		
		#loading-bar {
			height: 100%;
			background: #0f0;
			width: 0%;
			transition: width 0.3s;
		}
	</style>
</head>
<body id="game_frame">
	<div id="startup-screen">
		<p>Minecraft 1.8 WASM-GC</p>
		<p id="loading-text">Loading...</p>
		<div id="loading-progress">
			<div id="loading-bar"></div>
		</div>
	</div>
	<div id="error-message"></div>

	<script>
		// ============================================================================
		// Minecraft 1.8 WASM-GC Standalone Client
		// ============================================================================
		// This script loads and initializes the Minecraft 1.8 WASM-GC client without
		// any launcher UI. Place assets.epw, bootstrap.js in the same directory.
		// ============================================================================

		'use strict';

		// Configuration
		const CONFIG = {
			// Path to bootstrap.js (should be in same directory)
			bootstrapPath: './bootstrap.js',
			
			// Path to assets.epw (should be in same directory)
			assetsPath: './assets.epw',
			
			// Relay servers for multiplayer
			relayServers: [
				{ addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: true },
				{ addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: false },
				{ addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: false }
			],
			
			// Custom servers (add your own here)
			customServers: [
				// Example: { addr: "ws://localhost:8081/", name: "Local Server" }
			],
			
			// Enable demo mode (20 min limit, if supported)
			demoMode: false,
			
			// IndexedDB database name for worlds
			worldsDB: "worlds"
		};

		// Utility functions
		function log(msg) {
			console.log("[MC Client] " + msg);
		}

		function warn(msg) {
			console.warn("[MC Client] " + msg);
		}

		function error(msg) {
			console.error("[MC Client] " + msg);
		}

		function setLoadingText(text) {
			const el = document.getElementById('loading-text');
			if (el) el.textContent = text;
		}

		function setLoadingProgress(percent) {
			const bar = document.getElementById('loading-bar');
			if (bar) bar.style.width = Math.min(100, percent) + '%';
		}

		function showError(msg) {
			const el = document.getElementById('error-message');
			if (el) {
				el.textContent = msg;
				el.style.display = 'block';
				error(msg);
			}
		}

		function removeStartupScreen() {
			const screen = document.getElementById('startup-screen');
			if (screen && screen.parentNode) {
				screen.parentNode.removeChild(screen);
			}
		}

		// ============================================================================
		// Main Initialization
		// ============================================================================

		async function initializeClient() {
			try {
				log("Initializing Minecraft 1.8 WASM-GC client...");
				setLoadingText("Initializing...");
				setLoadingProgress(5);

				// Check if running over HTTP
				if (window.location.href.indexOf("file:") === 0) {
					throw new Error("HTTP required: Do not open this file locally. Run a local HTTP server (e.g., python -m http.server 8000)");
				}

				// Load and apply custom skin from launcher (if available)
				applyLauncherSkin();

				// Configure game options
				log("Configuring game options...");
				setLoadingProgress(10);
				
				window.eaglercraftXOpts = {
					demoMode: CONFIG.demoMode,
					container: "game_frame",
					assetsURI: CONFIG.assetsPath,
					worldsDB: CONFIG.worldsDB,
					servers: CONFIG.customServers,
					relays: CONFIG.relayServers
				};

				// Check for server parameter in URL (?server=ws://...)
				const urlParams = new URLSearchParams(window.location.search);
				const serverParam = urlParams.get('server');
				if (serverParam) {
					log("Joining server: " + serverParam);
					window.eaglercraftXOpts.joinServer = serverParam;
				}

				// Load bootstrap script
				log("Loading bootstrap...");
				setLoadingProgress(20);
				
				await loadScript(CONFIG.bootstrapPath);

				log("Bootstrap loaded, starting client...");
				setLoadingProgress(50);

				// Call main() from bootstrap.js
				if (typeof window.main === 'function') {
					await window.main();
					log("Client started successfully!");
				} else {
					throw new Error("window.main() is not available after loading bootstrap.js");
				}

			} catch (err) {
				showError("Failed to start client: " + err.message);
				log("Stack: " + err.stack);
				setLoadingText("ERROR - See console for details");
			}
		}

		function loadScript(src) {
			return new Promise((resolve, reject) => {
				const script = document.createElement('script');
				script.type = 'text/javascript';
				script.src = src;
				script.onload = resolve;
				script.onerror = () => reject(new Error("Failed to load " + src));
				document.head.appendChild(script);
			});
		}

		function applyLauncherSkin() {
			try {
				const rawSkin = localStorage.getItem("launcher.customSkin");
				if (!rawSkin) return;
				
				const skin = JSON.parse(rawSkin);
				if (!skin || !skin.data) return;

				const model = (skin.model === "slim") ? "slim" : "default";
				const namespaces = ["_eaglercraft_1.12", "_eaglercraftX", "_eaglercraft_1.8"];
				
				function mergeProfile(existing) {
					let profile = {};
					try {
						profile = existing ? JSON.parse(existing) : {};
					} catch (e) {
						profile = {};
					}
					
					if (typeof profile !== "object" || profile === null) profile = {};
					
					profile.customSkin = {
						data: skin.data || skin.raw,
						model: model
					};
					profile.customSkinModel = model;
					profile.presetSkin = "CUSTOM";
					
					return JSON.stringify(profile);
				}

				for (let i = 0; i < namespaces.length; i++) {
					const ns = namespaces[i];
					try {
						const existing = localStorage.getItem(ns + ".profile");
						localStorage.setItem(ns + ".profile", mergeProfile(existing));
					} catch (e) {}
				}
				
				log("Applied custom skin from launcher");
			} catch (e) {
				warn("Could not apply launcher skin: " + e.message);
			}
		}

		// ============================================================================
		// Startup Screen Removal (when game renders)
		// ============================================================================

		function setupStartupScreenRemoval() {
			let attempts = 0;
			const maxAttempts = 1800; // ~30 seconds at 60fps
			const startTime = Date.now();

			function checkCanvas() {
				const canvas = document.querySelector('canvas');
				if (canvas) {
					log("Canvas detected, removing startup screen");
					removeStartupScreen();
					return;
				}

				if (attempts >= maxAttempts || (Date.now() - startTime) > 30000) {
					log("Timeout waiting for canvas, removing startup screen anyway");
					removeStartupScreen();
					return;
				}

				attempts++;
				requestAnimationFrame(checkCanvas);
			}

			checkCanvas();
		}

		// ============================================================================
		// Event Listeners & Page Load
		// ============================================================================

		window.addEventListener('load', async function() {
			setupStartupScreenRemoval();
			await initializeClient();
		});

		// Prevent scrolling on mobile
		window.addEventListener('touchmove', function(e) {
			if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
				e.preventDefault();
			}
		}, { passive: false });

		window.addEventListener('scroll', function() {
			window.scrollTo(0, 0);
		});

		log("Minecraft 1.8 WASM-GC client script loaded");
		
	</script>
</body>
</html>
